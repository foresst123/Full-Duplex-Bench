[project]
name = "vi-fdb-harness"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
fd-badcat = ["websockets>=12"]
asr = [
  "accelerate>=0.26",
  "chunkformer",
  "openai-whisper",
  "silero-vad>=6.2.1",
  "soundfile",
  "torch==2.6.0",
  "torchaudio==2.6.0",
  "torchvision==0.21.0",
  "transformers",
]
judge = ["openai>=1.0"]

[project.scripts]
vi-fdb = "harness:main"
vi-fdb-asr = "transcribe:main"
vi-fdb-judge = "judge:main"

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
